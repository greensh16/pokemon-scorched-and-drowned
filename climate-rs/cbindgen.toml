# Generates include/climate.h from the extern "C" functions in src/ffi.rs.
# Run: make climate-header   (needs `cargo install cbindgen`)
language = "C"
include_guard = "GUARD_CLIMATE_H"
autogen_warning = "/* Generated by cbindgen from climate-rs/src/ffi.rs. Do not edit by hand. */"
sys_includes = ["stdint.h", "stdbool.h"]
no_includes = true
documentation = true
documentation_style = "c99"

[parse]
parse_deps = false
